[project]
name = "briefapp-context-box"
version = "0.1.0"
description = "FastAPI backend for Briefapp Context-Box RAG system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "lancedb>=0.13.0",
    "boto3>=1.35.32",
    "google-genai>=0.2.0",
    "fsspec>=2024.9.0",
    "s3fs>=2024.9.0",
    "python-multipart>=0.0.12",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "isort>=5.13.2"
]
