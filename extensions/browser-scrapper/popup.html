<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefapp Context Scrapper</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">

    <!-- ── Header ── -->
    <header>
      <div class="logo">
        <img src="icons/icon48.png" alt="Briefapp" class="p-logo">
        <h1>Briefapp<span>Box</span></h1>
      </div>
      <p class="subtitle">Intelligent Context Injection</p>
    </header>

    <!-- ══════════════ HOME VIEW ══════════════ -->
    <main id="home-view">
      <!-- Status badge -->
      <div class="status-container">
        <div class="status-badge" id="status-badge">
          <span class="pulse-indicator" id="pulse"></span>
          <span id="status-label">Pronto</span>
        </div>
        <div class="char-count" id="char-count" style="display:none;"></div>
      </div>

      <!-- Preview -->
      <div class="content-preview" id="preview-area">
        <p class="placeholder" id="preview-placeholder">Aguardando extração...</p>
      </div>

      <!-- Botão principal -->
      <button id="ingest-btn" class="primary-button">
        <span class="icon">📥</span>
        <span class="btn-text">Ingest Page</span>
      </button>

      <!-- Hint seleção -->
      <p class="hint" id="selection-hint">💡 Selecione texto na página para capturar apenas um trecho</p>

      <!-- Histórico -->
      <div class="history-section" id="history-section" style="display:none;">
        <div class="history-header">
          <span class="history-title">Histórico</span>
          <button class="clear-history-btn" id="clear-history">Limpar</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
      </div>
    </main>

    <!-- ══════════════ SETTINGS VIEW ══════════════ -->
    <div id="settings-view" class="hidden">
      <h2 class="view-title">⚙️ Configurações</h2>

      <div class="form-group">
        <label for="briefapp-url">Briefapp MCP Endpoint</label>
        <input type="text" id="briefapp-url" placeholder="http://76.13.238.113:8481/mcp">
      </div>

      <div class="form-group">
        <label for="box-id">Box ID (Context-Box alvo)</label>
        <input type="text" id="box-id" placeholder="uuid-do-box">
        <span class="field-hint">Deixe vazio para usar o box padrão</span>
      </div>

      <div class="form-group">
        <label for="api-key">API Key (opcional)</label>
        <input type="password" id="api-key" placeholder="••••••••">
      </div>

      <button id="save-settings" class="secondary-button">💾 Salvar Configurações</button>
      <button id="back-btn" class="text-button">← Voltar</button>
    </div>

    <!-- ── Footer ── -->
    <footer>
      <div class="target-info">
        <span class="label">Target:</span>
        <span id="endpoint-display">—</span>
      </div>
      <button id="settings-btn" class="icon-button" title="Configurações">⚙️</button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>

</html>
